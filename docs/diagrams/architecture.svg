<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">VolleyBro Clean Architecture</title>
  <desc id="architecture-desc">Four nested Clean Architecture layers — frameworks and drivers, interface adapters, use cases, entities — where every source dependency points inward and the infrastructure layer implements the repository and service interfaces declared by the use cases.</desc>
  <defs>
    <style>
      .paper { fill: #f2f2f6; }
      .ink { fill: #000000; }
      .muted { fill: #626262; }
      .accent-t { fill: #10687e; }
      .r1 { fill: none; stroke: rgba(0,0,0,0.28); }
      .r2 { fill: none; stroke: rgba(0,0,0,0.36); }
      .r3 { fill: none; stroke: rgba(0,0,0,0.46); }
      .core { fill: rgba(16,104,126,0.07); stroke: #10687e; }
      .node { fill: #fbfbfb; stroke: #000000; }
      .wire { stroke: #626262; fill: none; }
      .wire-accent { stroke: #10687e; fill: none; }
      .rule { stroke: #dddee5; }
      .head { fill: #626262; }
      .head-accent { fill: #10687e; }
      text { font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #020a17; }
        .ink { fill: #f4f5f6; }
        .muted { fill: #94a3b8; }
        .accent-t { fill: #22a3c3; }
        .r1 { fill: none; stroke: rgba(244,245,246,0.22); }
        .r2 { fill: none; stroke: rgba(244,245,246,0.30); }
        .r3 { fill: none; stroke: rgba(244,245,246,0.40); }
        .core { fill: rgba(34,163,195,0.10); stroke: #22a3c3; }
        .node { fill: #1d232d; stroke: #94a3b8; }
        .wire { stroke: #94a3b8; }
        .wire-accent { stroke: #22a3c3; }
        .rule { stroke: #344867; }
        .head { fill: #94a3b8; }
        .head-accent { fill: #22a3c3; }
      }
    </style>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="head" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="head-accent" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect class="paper" width="1000" height="520" rx="8"/>

  <!-- Rings: outer → inner -->
  <rect class="r1" x="40" y="40" width="920" height="400" rx="8" stroke-width="1"/>
  <rect class="r2" x="64" y="76" width="748" height="328" rx="8" stroke-width="1"/>
  <rect class="r3" x="88" y="112" width="524" height="256" rx="8" stroke-width="1"/>
  <rect class="core" x="112" y="148" width="284" height="184" rx="8" stroke-width="1"/>

  <!-- Ring labels on paper masks -->
  <rect class="paper" x="52" y="32" width="148" height="16"/>
  <text class="mono muted" x="60" y="44" font-size="8" letter-spacing="0.14em">④ FRAMEWORKS &amp; DRIVERS</text>
  <rect class="paper" x="76" y="68" width="136" height="16"/>
  <text class="mono muted" x="84" y="80" font-size="8" letter-spacing="0.14em">③ INTERFACE ADAPTERS</text>
  <rect class="paper" x="100" y="104" width="84" height="16"/>
  <text class="mono ink" x="108" y="116" font-size="8" letter-spacing="0.14em">② USE CASES</text>
  <rect class="paper" x="124" y="140" width="76" height="16"/>
  <text class="mono accent-t" x="132" y="152" font-size="8" letter-spacing="0.14em" font-weight="600">① ENTITIES</text>

  <!-- Connectors (drawn before nodes) -->
  <line class="wire" x1="828" y1="200" x2="797" y2="200" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="wire" x1="644" y1="200" x2="581" y2="200" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="wire" x1="428" y1="200" x2="397" y2="200" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="wire-accent" x1="828" y1="296" x2="581" y2="296" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#architecture-arrow-accent)"/>
  <rect class="paper" x="664" y="276" width="80" height="12" rx="2"/>
  <text class="mono accent-t" x="704" y="285" font-size="8" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>

  <!-- ④ Frameworks & Drivers -->
  <rect class="node" x="828" y="176" width="120" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="888" y="197" font-size="12" font-weight="600" text-anchor="middle">Next.js app</text>
  <text class="mono muted" x="888" y="212" font-size="9" text-anchor="middle">app/ · components/</text>

  <rect class="node" x="828" y="272" width="120" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="888" y="293" font-size="12" font-weight="600" text-anchor="middle">Infrastructure</text>
  <text class="mono muted" x="888" y="308" font-size="9" text-anchor="middle">db · services · di</text>

  <!-- ③ Interface Adapters -->
  <rect class="node" x="644" y="176" width="152" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="720" y="197" font-size="12" font-weight="600" text-anchor="middle">Controllers</text>
  <text class="mono muted" x="720" y="212" font-size="9" text-anchor="middle">interface/</text>

  <!-- ② Use Cases -->
  <rect class="node" x="428" y="176" width="152" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="504" y="197" font-size="12" font-weight="600" text-anchor="middle">Use cases</text>
  <text class="mono muted" x="504" y="212" font-size="9" text-anchor="middle">CreateRally, …</text>

  <rect class="node" x="428" y="272" width="152" height="48" rx="6" stroke-width="1"/>
  <text class="ink" x="504" y="293" font-size="12" font-weight="600" text-anchor="middle">Interfaces</text>
  <text class="mono muted" x="504" y="308" font-size="9" text-anchor="middle">repositories · services</text>

  <!-- ① Entities (focal core) -->
  <text class="ink" x="254" y="236" font-size="16" font-weight="600" text-anchor="middle">Domain entities</text>
  <text class="mono muted" x="254" y="258" font-size="9" text-anchor="middle">User · Team · Player · Profile · Game</text>

  <!-- Legend strip -->
  <line class="rule" x1="40" y1="464" x2="960" y2="464" stroke-width="0.8"/>
  <text class="mono muted" x="40" y="490" font-size="8" letter-spacing="0.14em">LEGEND</text>
  <line class="wire" x1="120" y1="487" x2="152" y2="487" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <text class="mono muted" x="164" y="490" font-size="8" letter-spacing="0.08em">SOURCE DEPENDENCY · ALWAYS POINTS INWARD</text>
  <line class="wire-accent" x1="440" y1="487" x2="472" y2="487" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#architecture-arrow-accent)"/>
  <text class="mono muted" x="484" y="490" font-size="8" letter-spacing="0.08em">IMPLEMENTS · BOUND BY INVERSIFYJS AT RUNTIME</text>
</svg>
