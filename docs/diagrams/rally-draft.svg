<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rally-draft-title rally-draft-desc">
  <title id="rally-draft-title">Recording a rally: the entry draft</title>
  <desc id="rally-draft-desc">Three taps stage a rally in a Redux Toolkit entry draft (player, our move, opponent move and outcome, with an opponent error skipping our move), and the preview's send action submits it.</desc>
  <defs>
    <style>
      .paper { fill: #f2f2f6; }
      .ink { fill: #000000; }
      .muted { fill: #626262; }
      .accent-t { fill: #10687e; }
      .zone { fill: none; stroke: rgba(0,0,0,0.28); }
      .node { fill: #fbfbfb; stroke: #000000; }
      .store { fill: rgba(0,0,0,0.05); stroke: #626262; }
      .focal { fill: rgba(16,104,126,0.08); stroke: #10687e; }
      .wire { stroke: #626262; fill: none; }
      .wire-accent { stroke: #10687e; fill: none; }
      .head { fill: #626262; }
      .head-accent { fill: #10687e; }
      text { font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #020a17; }
        .ink { fill: #f4f5f6; }
        .muted { fill: #94a3b8; }
        .accent-t { fill: #22a3c3; }
        .zone { stroke: rgba(244,245,246,0.22); }
        .node { fill: #1d232d; stroke: #94a3b8; }
        .store { fill: rgba(244,245,246,0.05); stroke: #94a3b8; }
        .focal { fill: rgba(34,163,195,0.10); stroke: #22a3c3; }
        .wire { stroke: #94a3b8; }
        .wire-accent { stroke: #22a3c3; }
        .head { fill: #94a3b8; }
        .head-accent { fill: #22a3c3; }
      }
    </style>
    <marker id="rally-draft-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
    <marker id="rally-draft-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
  </defs>
  <rect class="paper" y="0" width="1000" height="256" rx="8"/>
  <rect class="zone" x="24" y="40" width="720" height="144" rx="8" stroke-width="1"/>
  <rect class="paper" x="36" y="32" width="188" height="16"/>
  <text class="mono muted" x="44" y="44" font-size="8" letter-spacing="0.14em">REDUX TOOLKIT · ENTRY DRAFT</text>
  <path class="wire" d="M 240 112 H 280" stroke-width="1.2" marker-end="url(#rally-draft-arrow)"/>
  <path class="wire" d="M 480 112 H 520" stroke-width="1.2" marker-end="url(#rally-draft-arrow)"/>
  <path class="wire-accent" d="M 720 112 H 780" stroke-width="1.2" marker-end="url(#rally-draft-arrow-accent)"/>
  <path class="wire" d="M 140 144 V 208 Q 140 216 148 216 H 612 Q 620 216 620 208 V 145" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rally-draft-arrow)"/>
  <rect class="paper" x="336" y="197" width="88" height="12" rx="2"/>
  <text class="mono muted" x="380" y="206" font-size="8" text-anchor="middle" letter-spacing="0.06em">OPPONENT ERROR</text>
  <rect class="node" x="40" y="80" width="200" height="64" rx="6" stroke-width="1"/>
  <text class="ink" x="140" y="110" font-size="12" font-weight="600" text-anchor="middle">① Player</text>
  <text class="mono muted" x="140" y="124" font-size="9" text-anchor="middle">tap court · setEntryDraftPlayer</text>
  <rect class="node" x="280" y="80" width="200" height="64" rx="6" stroke-width="1"/>
  <text class="ink" x="380" y="110" font-size="12" font-weight="600" text-anchor="middle">② Our move</text>
  <text class="mono muted" x="380" y="124" font-size="9" text-anchor="middle">setEntryDraftHomeMove</text>
  <rect class="node" x="520" y="80" width="200" height="64" rx="6" stroke-width="1"/>
  <text class="ink" x="620" y="110" font-size="12" font-weight="600" text-anchor="middle">③ Opponent move</text>
  <text class="mono muted" x="620" y="124" font-size="9" text-anchor="middle">setEntryDraftAwayMove</text>
  <rect class="focal" x="780" y="80" width="180" height="64" rx="6" stroke-width="1"/>
  <text class="accent-t" x="870" y="110" font-size="12" font-weight="600" text-anchor="middle">Preview &amp; send</text>
  <text class="mono muted" x="870" y="124" font-size="9" text-anchor="middle">submits the draft</text>
</svg>
