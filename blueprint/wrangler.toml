name = "volleybro-blueprint"
compatibility_date = "2026-07-01"

[assets]
directory = "./out"

[build]
# Hosted builds set CI, which already makes a missing page store fatal. This
# only matters when someone deploys from a shell.
command = "BLUEPRINT_REQUIRE_CHANGES=1 pnpm --filter blueprint build"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
