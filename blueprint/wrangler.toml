name = "volleybro-blueprint"
compatibility_date = "2026-07-01"

[assets]
directory = "./out"

[build]
# Deploy consumes the existing export; it never starts a second Next build.
command = "node ../scripts/blueprint-check-output.js"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
