name: Blueprint Preview

run-name: Blueprint Preview ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA for the requested source branch
        required: true
        type: string
      store_sha:
        description: Full commit SHA for the Blueprint changes store
        required: true
        type: string
      integration_sha:
        description: Full commit SHA for the integration snapshot
        required: true
        type: string
      branch:
        description: Named source branch
        required: true
        type: string
      slug:
        description: Blueprint Change slug
        required: true
        type: string
      input_hash:
        description: Full SHA-256 hash of the Blueprint Change inputs
        required: true
        type: string
      request_id:
        description: UUID that correlates this preview request
        required: true
        type: string

permissions: {}

concurrency:
  group: blueprint-preview-volleybro-blueprint
  queue: max
  cancel-in-progress: false

jobs:
  request:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      INPUT_STORE_SHA: ${{ inputs.store_sha }}
      INPUT_INTEGRATION_SHA: ${{ inputs.integration_sha }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_SLUG: ${{ inputs.slug }}
      INPUT_HASH: ${{ inputs.input_hash }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Validate request and public snapshots
        run: node controller/scripts/blueprint-preview.js validate-request

  build:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      INPUT_STORE_SHA: ${{ inputs.store_sha }}
      INPUT_INTEGRATION_SHA: ${{ inputs.integration_sha }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_SLUG: ${{ inputs.slug }}
      INPUT_HASH: ${{ inputs.input_hash }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          version: 12.9.1
          install: false
          node-version-file: false
      - name: Fetch the exact public source branch without credentials
        run: |
          git clone --no-tags --depth=1 --single-branch --branch "$INPUT_BRANCH" https://github.com/andrewck24/volleybro.git candidate
          test "$(git -C candidate rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
      - name: Install dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Build the pinned Blueprint snapshots
        working-directory: candidate
        env:
          BLUEPRINT_CHANGES_STORE_SHA: ${{ inputs.store_sha }}
          BLUEPRINT_INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: pnpm --filter blueprint build
      - name: Validate build receipt and reject unsafe output files
        working-directory: candidate
        env:
          PREVIEW_ARTIFACT_DIR: blueprint/dist
        run: node ../controller/scripts/blueprint-preview.js validate-artifact
      - name: Detect a mockup in the requested snapshot
        id: mockup
        working-directory: candidate
        run: node ../controller/scripts/blueprint-preview.js detect-mockup
      - name: Install headless Chromium for a mockup snapshot
        if: steps.mockup.outputs.has_mockup == 'true'
        working-directory: candidate
        run: pnpm --filter blueprint exec playwright install --with-deps --only-shell chromium
      - name: Prove the mockup route against the exact build receipt
        if: steps.mockup.outputs.has_mockup == 'true'
        working-directory: controller
        env:
          PREVIEW_ARTIFACT_DIR: ${{ github.workspace }}/candidate/blueprint/dist
          CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/candidate
        run: node scripts/blueprint-mockup-proof.mjs
      - name: Upload the same-run static build artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blueprint-preview-${{ inputs.request_id }}
          path: candidate/blueprint/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}

  upload:
    needs: [request, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
      INPUT_STORE_SHA: ${{ inputs.store_sha }}
      INPUT_INTEGRATION_SHA: ${{ inputs.integration_sha }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_SLUG: ${{ inputs.slug }}
      INPUT_HASH: ${{ inputs.input_hash }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Initialize isolated runner paths
        run: |
          printf '%s\n' \
            "PREVIEW_ARTIFACT_DIR=$RUNNER_TEMP/blueprint-preview-artifact" \
            "WRANGLER_CONFIG_PATH=$RUNNER_TEMP/blueprint-preview-deploy/wrangler.json" \
            "WRANGLER_CLI=$RUNNER_TEMP/blueprint-preview-wrangler/node_modules/wrangler/bin/wrangler.js" \
            >> "$GITHUB_ENV"
      - name: Download the exact artifact from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/blueprint-preview-artifact
      - name: Validate the artifact receipt and file types
        run: node controller/scripts/blueprint-preview.js validate-artifact
      - name: Prepare the isolated Wrangler configuration
        id: preview
        run: node controller/scripts/blueprint-preview.js prepare-upload
      - name: Install the pinned Wrangler CLI before credential access
        run: |
          npm --cache "$RUNNER_TEMP/blueprint-preview-npm-cache" install \
            --prefix "$RUNNER_TEMP/blueprint-preview-wrangler" \
            --no-save --ignore-scripts --no-audit --no-fund wrangler@4.147.0
          test "$(node "$WRANGLER_CLI" --version)" = "4.147.0"
      - name: Revalidate the source branch immediately before upload
        run: node controller/scripts/blueprint-preview.js revalidate-branch
      - name: Upload an isolated static Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BLUEPRINT_PREVIEW_DEPLOY_TOKEN }}
        run: node controller/scripts/blueprint-preview.js upload
