name: Spec Pages

on:
  push:
    paths:
      - "docs/changes/**"
      - "docs/shell.html"
  workflow_dispatch:

# GitHub Pages on a private repo is only accessible to repository collaborators.
# For per-branch preview URLs or unauthenticated access, migrate to Cloudflare Pages
# + Cloudflare Access (Google OAuth gate). All branches share the same Pages URL here;
# last push to docs/** wins.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          python3 - <<'PYEOF'
          import os, json, re, shutil, pathlib
          from datetime import datetime, timezone

          BUILD   = pathlib.Path(".pages-build")
          CHANGES = pathlib.Path("docs/changes")
          SHELL   = pathlib.Path("docs/shell.html")
          repo    = os.environ.get("GH_REPO", "")

          BUILD.mkdir(exist_ok=True)
          (BUILD / "changes").mkdir(exist_ok=True)

          if SHELL.exists():
              shutil.copy(SHELL, BUILD / "shell.html")

          def esc(s):
              if s is None: return ""
              return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"',"&quot;")

          manifests = []

          for cdir in sorted(p for p in CHANGES.iterdir() if p.is_dir()):
              # Skip directories that aren't changes (e.g. stale specs/ at root level)
              if not any((cdir / f).exists() for f in ["meta.json", "proposal.md", "proposal.html"]):
                  continue
              name = cdir.name
              cb   = BUILD / "changes" / name
              cb.mkdir(exist_ok=True)

              # Copy HTML + MD artifacts
              for stem in ["proposal", "design", "mockup", "review", "tasks"]:
                  for ext in [".html", ".md"]:
                      src = cdir / (stem + ext)
                      if src.exists():
                          shutil.copy(src, cb)

              # Copy specs subtree
              specs_src = cdir / "specs"
              if specs_src.exists():
                  shutil.copytree(specs_src, cb / "specs", dirs_exist_ok=True)

              # Read meta.json (human-authored: summary, dates, PR info)
              meta = {}
              if (cdir / "meta.json").exists():
                  meta = json.loads((cdir / "meta.json").read_text())

              # Count tasks
              total = done = 0
              tasks_file = cdir / "tasks.md"
              if tasks_file.exists():
                  src_text = tasks_file.read_text()
                  total = len(re.findall(r'^\s*- \[[ xX]\]', src_text, re.MULTILINE))
                  done  = len(re.findall(r'^\s*- \[[xX]\]',  src_text, re.MULTILINE))

              def art(stem):
                  return {"html": (cdir / f"{stem}.html").exists(),
                          "md":   (cdir / f"{stem}.md").exists()}

              specs_list = []
              if specs_src.exists():
                  for sd in sorted(p for p in specs_src.iterdir() if p.is_dir()):
                      specs_list.append({"name": sd.name,
                                         "html": (sd / "spec.html").exists()})

              manifest = {
                  "name":        name,
                  "summary":     meta.get("summary", ""),
                  "proposedAt":  meta.get("proposedAt"),
                  "prNumber":    meta.get("prNumber"),
                  "prCreatedAt": meta.get("prCreatedAt"),
                  "done":        done,
                  "total":       total,
                  "artifacts": {
                      "proposal": art("proposal"),
                      "design":   art("design"),
                      "review":   art("review"),
                  },
                  "specs": specs_list,
              }
              (cb / "manifest.json").write_text(json.dumps(manifest, indent=2))
              manifests.append(manifest)

          # ── index.html ──────────────────────────────────────────────────────
          cards = ""
          for m in manifests:
              name = m["name"]
              pct  = round(m["done"] / m["total"] * 100) if m["total"] else 0

              pr_badge = ""
              if m.get("prNumber"):
                  pr_url = f"https://github.com/{repo}/pull/{m['prNumber']}"
                  pr_badge = f'<a class="pr-badge" href="{esc(pr_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">PR #{esc(str(m["prNumber"]))}</a>'

              meta_parts = []
              if m.get("proposedAt"):
                  meta_parts.append(f'<span>Proposed {esc(m["proposedAt"])}</span>')
              if m.get("prCreatedAt"):
                  meta_parts.append(f'<span>PR opened {esc(m["prCreatedAt"])}</span>')
              meta_row = " · ".join(meta_parts)

              card_url = f"shell.html?change={esc(name)}"
              cards += f"""
          <div class="card" role="link" tabindex="0" onclick="location.href='{card_url}'" onkeydown="if(event.key==='Enter')location.href='{card_url}'">
            <div class="card-top">
              <span class="card-name">{esc(name)}</span>
              {pr_badge}
            </div>
            <p class="card-sum">{esc(m.get("summary",""))}</p>
            <div class="card-meta">{meta_row}</div>
            <div class="prog" role="progressbar" aria-valuenow="{m['done']}" aria-valuemin="0" aria-valuemax="{m['total']}" aria-label="{m['done']} of {m['total']} tasks done">
              <span style="width:{pct}%"></span>
              <em>{m['done']}/{m['total']} tasks</em>
            </div>
          </div>"""

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          index = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Spec Changes</title>
          <style>
          :root{{--bg:#0f1115;--fg:#e6e8ee;--mut:#9aa0ad;--card:#1a1d24;--line:#2a2f3a;--accent:#7aa2ff}}
          @media(prefers-color-scheme:light){{:root{{--bg:#f6f7f9;--fg:#1a1d24;--mut:#5a6172;--card:#fff;--line:#e2e5ea;--accent:#3b5bdb}}}}
          [data-theme=dark]{{--bg:#0f1115;--fg:#e6e8ee;--mut:#9aa0ad;--card:#1a1d24;--line:#2a2f3a;--accent:#7aa2ff}}
          [data-theme=light]{{--bg:#f6f7f9;--fg:#1a1d24;--mut:#5a6172;--card:#fff;--line:#e2e5ea;--accent:#3b5bdb}}
          *{{box-sizing:border-box}}body{{margin:0;font:15px/1.65 system-ui,sans-serif;background:var(--bg);color:var(--fg)}}
          main{{max-width:900px;margin:0 auto;padding:32px 20px 64px}}
          h1{{font-size:24px;margin:0 0 4px}}
          .sub{{color:var(--mut);font-size:13px;margin:0 0 28px}}
          .grid{{display:flex;flex-direction:column;gap:14px}}
          .card{{display:block;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s}}
          .card:hover,.card:focus-visible{{border-color:var(--accent);outline:none}}
          .card-top{{display:flex;align-items:center;gap:8px;margin-bottom:6px}}
          .card-name{{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
          .pr-badge{{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 7px;white-space:nowrap;text-decoration:none;flex-shrink:0}}
          .pr-badge:hover{{background:var(--accent);color:var(--bg)}}
          .card-sum{{margin:0 0 8px;font-size:13px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
          .card-meta{{font-size:12px;color:var(--mut);margin-bottom:10px}}
          .prog{{display:flex;align-items:center;position:relative;height:18px;background:var(--line);border-radius:5px;overflow:hidden}}
          .prog span{{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.55}}
          .prog em{{position:relative;font-style:normal;font-size:11px;padding-left:8px;color:var(--fg)}}
          #themeBtn{{position:fixed;top:12px;right:16px;appearance:none;background:none;border:0;font-size:18px;cursor:pointer;line-height:1;color:var(--mut)}}
          </style>
          <script>
          (function(){{
            var btn=document.createElement('button');btn.id='themeBtn';btn.title='Toggle dark/light mode';btn.setAttribute('aria-label','Toggle theme');
            var sys=function(){{return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}};
            var apply=function(t){{document.documentElement.dataset.theme=t;btn.textContent=t==='dark'?'☀':'☾';}};
            document.addEventListener('DOMContentLoaded',function(){{document.body.appendChild(btn);}});
            apply(localStorage.getItem('theme')||sys());
            btn.onclick=function(){{var n=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',n);apply(n);}};
          }})();
          </script>
          </head>
          <body>
          <main>
            <h1>Spec Changes</h1>
            <p class="sub">Updated {now}</p>
            <div class="grid">{cards}
            </div>
          </main>
          </body>
          </html>"""
          (BUILD / "index.html").write_text(index)
          print(f"Built {len(manifests)} change(s) into {BUILD}/")
          PYEOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build

      - uses: actions/deploy-pages@v4
        id: deploy
