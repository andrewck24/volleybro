name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**"

jobs:
  claude-review:
    # Skip on demand, two granularities:
    # - PR title [skip review]: every push to the PR is skipped (release PRs,
    #   changeset-only, mechanical bumps).
    # - Head commit message [skip review]: skips review for that push only
    #   (e.g. a doc-fix follow-up on an already-reviewed PR); checked in the
    #   first step below because pull_request payloads don't carry the commit
    #   message. Docs-only PRs are already excluded via paths-ignore above.
    # Native [skip ci] also works but skips ALL workflows including Verify.
    if: ${{ !contains(github.event.pull_request.title, '[skip review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Check head commit for skip marker
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.message')
          if printf '%s' "$msg" | grep -qF '[skip review]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit opts out of review; skipping."
          fi

      - name: Checkout repository
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.skip.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
