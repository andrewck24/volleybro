name: Production release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated hotfix, normal retry, or recover a promoted run
        required: true
        default: hotfix
        type: choice
        options: [hotfix, normal-retry, recover]
      pull_request:
        description: Reviewed hotfix PR or previously merged version PR number
        required: false
        type: string
      sha:
        description: Exact hotfix head SHA or version PR merge SHA
        required: false
        type: string
      original_run:
        description: Original production release run ID (recover only)
        required: false
        type: string

permissions: {}
cache-mode: read

env:
  RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}

jobs:
  candidate:
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.title == 'release: update versions') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.mode != 'recover'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      actions: read
    outputs:
      candidate_id: ${{ steps.stage.outputs.candidate_id }}
      candidate_url: ${{ steps.stage.outputs.candidate_url }}
      baseline: ${{ steps.stage.outputs.baseline }}
      sha: ${{ steps.stage.outputs.sha }}
      controller_sha: ${{ steps.controller.outputs.controller_sha }}
      mode: ${{ steps.controller.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: controller
        name: Copy trusted release controller before candidate checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            controller_sha=$(git rev-parse HEAD)
            case "$DISPATCH_MODE" in
              hotfix|normal-retry) mode="$DISPATCH_MODE" ;;
              *) echo 'Unsupported release mode' >&2; exit 1 ;;
            esac
          else
            controller_sha=$(git rev-parse HEAD^1)
            mode=normal
          fi
          git show "$controller_sha:scripts/release-controls.js" > "$RUNNER_TEMP/release-controls.js"
          echo "controller_sha=$controller_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}/release-controls.js
          if-no-files-found: error
          retention-days: 7
      - name: Verify release authorization
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          HOTFIX_PR_NUMBER: ${{ inputs.pull_request }}
          RELEASE_PR_NUMBER: ${{ inputs.pull_request }}
          CONTROLLER_SHA: ${{ steps.controller.outputs.controller_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          MODE: ${{ steps.controller.outputs.mode }}
        run: |
          if [ "$MODE" = hotfix ]; then
            node "$RUNNER_TEMP/release-controls.js" authorize-hotfix
          elif [ "$MODE" = normal-retry ]; then
            node "$RUNNER_TEMP/release-controls.js" authorize-retry
          else
            node "$RUNNER_TEMP/release-controls.js" authorize
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: stage
        name: Stage exact SHA with production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_SHA: ${{ steps.authorize.outputs.sha }}
          RELEASE_AUTHORIZATION: ${{ steps.authorize.outputs.release_authorization }}
          CONTROLLER_SHA: ${{ steps.controller.outputs.controller_sha }}
          EXPECTED_BASELINE_DEPLOYMENT: ${{ steps.authorize.outputs.baseline_deployment }}
          EXPECTED_BASELINE_UPDATED_AT: ${{ steps.authorize.outputs.baseline_updated_at }}
          EXPECTED_BASELINE_SHA: ${{ steps.authorize.outputs.baseline_sha }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: node "$RUNNER_TEMP/release-controls.js" stage
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 1

  source-inspection:
    name: Inspect source QA
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      source_preview_needed: ${{ steps.inspect.outputs.source_preview_needed }}
      recovery_binding: ${{ steps.inspect.outputs.recovery_binding }}
      recovery_evidence: ${{ steps.inspect.outputs.recovery_evidence }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-state
          path: ${{ runner.temp }}
      - name: Reuse trusted source evidence and snapshot reviewed recovery proof
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_SOURCE_QA_GAP: ${{ vars.RELEASE_SOURCE_QA_GAP }}
          RELEASE_ROLLBACK_COMPATIBILITY: ${{ vars.RELEASE_ROLLBACK_COMPATIBILITY }}
          RELEASE_ROLLBACK_EVIDENCE: ${{ vars.RELEASE_ROLLBACK_EVIDENCE }}
        run: node "$RUNNER_TEMP/release-controls.js" inspect-source-qa
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-source-plan
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 1

  source-preview:
    name: Prepare source Preview
    needs: [candidate, source-inspection]
    if: needs.source-inspection.outputs.source_preview_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: integration-preview
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    environment: integration
    outputs:
      preview_id: ${{ steps.preview.outputs.preview_id }}
      preview_url: ${{ steps.preview.outputs.preview_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-source-plan
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Prepare only the uncovered browser flow
        id: preview
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          INTEGRATION_ALIAS: ${{ vars.INTEGRATION_ALIAS }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" prepare-source-preview

  source-preview-acceptance:
    name: Accept source Preview
    needs: [source-preview]
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production-release-review
      url: ${{ needs.source-preview.outputs.preview_url }}
    steps:
      - run: echo 'Only the documented source QA gap was accepted; this is not production OAuth evidence.'

  source-receipt:
    name: Record source QA
    needs:
      [candidate, source-inspection, source-preview, source-preview-acceptance]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.source-inspection.result == 'success' &&
      ((needs.source-inspection.outputs.source_preview_needed == 'true' && needs.source-preview-acceptance.result == 'success') ||
       (needs.source-inspection.outputs.source_preview_needed == 'false' && needs.source-preview-acceptance.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-source-plan
          path: ${{ runner.temp }}
      - name: Bind passing source evidence to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          SOURCE_PREVIEW_ID: ${{ needs.source-preview.outputs.preview_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          INTEGRATION_ALIAS: ${{ vars.INTEGRATION_ALIAS }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" record-source-qa
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-source-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 1

  candidate-summary:
    needs: [candidate, source-inspection, source-receipt]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.source-inspection.result == 'success' &&
      needs.source-receipt.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain candidate API and accepted evidence boundaries
        env:
          CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
          CANDIDATE_URL: ${{ needs.candidate.outputs.candidate_url }}
          BASELINE: ${{ needs.candidate.outputs.baseline }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_MODE: ${{ needs.candidate.outputs.mode }}
          ROLLBACK_COMPATIBILITY: ${{ needs.source-inspection.outputs.recovery_binding }}
          ROLLBACK_EVIDENCE: ${{ needs.source-inspection.outputs.recovery_evidence }}
        run: |
          binding="$BASELINE:$CANDIDATE_ID:$RELEASE_SHA"
          if [ "$ROLLBACK_COMPATIBILITY" = "$binding" ] && [ -n "$ROLLBACK_EVIDENCE" ]; then
            test -n "$ROLLBACK_EVIDENCE"
          fi
          {
            echo '### Production candidate acceptance'
            echo "- Candidate: \`$CANDIDATE_ID\` ($CANDIDATE_URL)"
            echo "- Authorized source SHA: \`$RELEASE_SHA\`"
            echo "- Production baseline: \`$BASELINE\`"
            if [ "$ROLLBACK_COMPATIBILITY" = "$binding" ] && [ -n "$ROLLBACK_EVIDENCE" ]; then
              echo "- Required recovery binding: $binding"
              echo "- Compatibility source evidence: $ROLLBACK_EVIDENCE"
              echo 'The controller reused source proof; approval accepts the reviewed recovery evidence for this exact deployment.'
            else
              echo 'Required recovery evidence is missing; candidate acceptance will stop without promotion.'
            fi
            echo "Source functionality is proven separately. Candidate readiness, production configuration, protection and baseline use Vercel API read-back; no Google login or unauthenticated HTTP probe on this random host is required. The exact $RELEASE_MODE source remains the release authorization."
          } >> "$GITHUB_STEP_SUMMARY"

  candidate-acceptance:
    name: Accept candidate evidence
    needs: [candidate, candidate-summary, source-inspection, source-receipt]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.candidate-summary.result == 'success' &&
      needs.source-inspection.result == 'success' &&
      needs.source-receipt.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment:
      name: production-release-review
      url: ${{ needs.candidate.outputs.candidate_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-release-source-state
          path: ${{ runner.temp }}/staged
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - name: Record reviewer-approved compatibility evidence
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/staged/release-state.json
          RELEASE_ACCEPTED_STATE_FILE: ${{ runner.temp }}/release-state.json
          GH_TOKEN: ${{ github.token }}
          RELEASE_ROLLBACK_COMPATIBILITY: ${{ needs.source-inspection.outputs.recovery_binding }}
          RELEASE_ROLLBACK_EVIDENCE: ${{ needs.source-inspection.outputs.recovery_evidence }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node "$RUNNER_TEMP/release-controls.js" record-compatibility
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 7

  promote-and-smoke:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, candidate-acceptance]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.candidate-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Recheck baseline and promote candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: node "$RUNNER_TEMP/release-controls.js" promote
      - name: Smoke production
        id: smoke
        continue-on-error: true
        env:
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 "https://$PRODUCTION_ALIAS/" >/dev/null
      - name: Roll back only with explicit compatibility evidence
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/release-controls.js" rollback-if-compatible
      - name: Fail after smoke failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  postdeploy-summary:
    needs: [candidate, promote-and-smoke]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.promote-and-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Bind live authentication smoke to the promoted candidate
        env:
          CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
          BASELINE: ${{ needs.candidate.outputs.baseline }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: |
          {
            echo '### Production post-deployment acceptance'
            echo "- Promoted candidate: \`$CANDIDATE_ID\`"
            echo "- Authorized source SHA: \`$RELEASE_SHA\`"
            echo "- Previous production baseline: \`$BASELINE\`"
            echo "- Live alias: https://$PRODUCTION_ALIAS"
            echo 'The automated smoke verified only that the production homepage responds. The protected reviewer must verify sign-in/session and the core read-only team flow on this live alias before the release is tagged.'
          } >> "$GITHUB_STEP_SUMMARY"

  production-acceptance:
    name: Accept production QA
    needs: [candidate, postdeploy-summary]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.postdeploy-summary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment:
      name: production-release-review
      url: https://${{ vars.PRODUCTION_ALIAS }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - name: Record exact production QA approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          RELEASE_FINAL_STATE_FILE: ${{ runner.temp }}/release-final-state.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" record-production-qa
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-final-state
          path: ${{ runner.temp }}/release-final-state.json
          if-no-files-found: error
          retention-days: 7

  recover-after-production-qa-failure:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, production-acceptance]
    if: always() && !cancelled() && needs.candidate.result == 'success' && needs.production-acceptance.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Roll back only with explicit compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/release-controls.js" rollback-if-compatible

  finalize-release:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, production-acceptance]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.production-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-final-state
          path: ${{ runner.temp }}
      - name: Tag exact SHA and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-final-state.json
        run: node "$RUNNER_TEMP/release-controls.js" finalize

  recover:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Verify original accepted artifact then recover its baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RELEASE_RUN_ID: ${{ inputs.original_run }}
          RELEASE_RECOVERY_STATE_FILE: ${{ runner.temp }}/release-recovery-state.json
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-recovery-state.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: |
          node scripts/release-controls.js recover-verify
          node scripts/release-controls.js rollback-if-compatible
          echo 'Owner recovery verified public health; no data rollback, tag or release publication.' >> "$GITHUB_STEP_SUMMARY"

  merge-back:
    needs: [candidate, finalize-release]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.finalize-release.result == 'success' &&
      needs.candidate.outputs.mode == 'hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - name: Prepare ordinary hotfix merge-back pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node "$RUNNER_TEMP/release-controls.js" merge-back

  failure-summary:
    needs:
      - candidate
      - candidate-acceptance
      - promote-and-smoke
      - production-acceptance
      - recover-after-production-qa-failure
      - finalize-release
      - merge-back
      - recover
      - source-inspection
      - source-preview
      - source-preview-acceptance
      - source-receipt
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record release failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Production release stopped'
            echo
            echo "A guarded release or merge-back job failed. Inspect the actual production deployment, tag and immutable artifacts before retrying; publication may have succeeded before synchronization failed: $RUN_URL"
            echo 'For synchronization failure, start an agent with this run and the accepted release-state artifact. Follow WORKFLOW.md hotfix synchronization; preserve both histories and pending changesets. Do not rerun publication or bypass checks to resolve merge-back.'
            echo 'For a promoted run left pending/cancelled, the owner may dispatch recover with its original run ID while accepted evidence remains available. Expired evidence or changed alias stops; no timeout recovery is implied.'
          } >> "$GITHUB_STEP_SUMMARY"
