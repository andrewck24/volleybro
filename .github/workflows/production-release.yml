name: Production release

# Do not switch back to pull_request: its merge ref fails the main-only QA environment (ADR-0127).
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated hotfix, normal retry, or recover a promoted run
        required: true
        default: hotfix
        type: choice
        options: [hotfix, normal-retry, recover]
      pull_request:
        description: Reviewed hotfix PR or previously merged version PR number
        required: false
        type: string
      sha:
        description: Exact hotfix head SHA or version PR merge SHA
        required: false
        type: string
      original_run:
        description: Original production release run ID (recover only)
        required: false
        type: string

permissions: {}
cache-mode: read

env:
  RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}

jobs:
  authorize:
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' && inputs.mode != 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      actions: read
    outputs:
      release: ${{ steps.authorize.outputs.release }}
      sha: ${{ steps.authorize.outputs.sha }}
      release_authorization: ${{ steps.authorize.outputs.release_authorization }}
      baseline_deployment: ${{ steps.authorize.outputs.baseline_deployment }}
      baseline_updated_at: ${{ steps.authorize.outputs.baseline_updated_at }}
      baseline_sha: ${{ steps.authorize.outputs.baseline_sha }}
      controller_sha: ${{ steps.controller.outputs.controller_sha }}
      mode: ${{ steps.controller.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || github.sha }}
          fetch-depth: 0
      - id: controller
        name: Copy trusted release controller before candidate checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            controller_sha=$(git rev-parse HEAD)
            case "$DISPATCH_MODE" in
              hotfix|normal-retry) mode="$DISPATCH_MODE" ;;
              *) echo 'Unsupported release mode' >&2; exit 1 ;;
            esac
          else
            controller_sha=$(git rev-parse HEAD^1)
            mode=normal
          fi
          git show "$controller_sha:scripts/release-controls.js" > "$RUNNER_TEMP/release-controls.js"
          echo "controller_sha=$controller_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}/release-controls.js
          if-no-files-found: error
          retention-days: 31
      - name: Verify release authorization
        id: authorize
        if: steps.controller.outputs.mode != 'hotfix'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          HOTFIX_PR_NUMBER: ${{ inputs.pull_request }}
          RELEASE_PR_NUMBER: ${{ inputs.pull_request }}
          CONTROLLER_SHA: ${{ steps.controller.outputs.controller_sha }}
          MODE: ${{ steps.controller.outputs.mode }}
        run: |
          if [ "$MODE" = normal-retry ]; then
            node "$RUNNER_TEMP/release-controls.js" authorize-retry
          else
            node "$RUNNER_TEMP/release-controls.js" authorize
          fi

  # The only job that references VERCEL_TOKEN before staging: GitHub sends a
  # referenced secret to the runner, so only a job-level condition keeps it
  # off every other mode's runner.
  authorize-hotfix:
    needs: authorize
    if: needs.authorize.outputs.mode == 'hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      actions: read
    outputs:
      release: ${{ steps.authorize.outputs.release }}
      sha: ${{ steps.authorize.outputs.sha }}
      release_authorization: ${{ steps.authorize.outputs.release_authorization }}
      baseline_deployment: ${{ steps.authorize.outputs.baseline_deployment }}
      baseline_updated_at: ${{ steps.authorize.outputs.baseline_updated_at }}
      baseline_sha: ${{ steps.authorize.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - name: Verify hotfix authorization
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          HOTFIX_PR_NUMBER: ${{ inputs.pull_request }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" authorize-hotfix

  candidate:
    needs: [authorize, authorize-hotfix]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' &&
      (needs.authorize-hotfix.result == 'success' ||
      needs.authorize-hotfix.result == 'skipped') &&
      (needs.authorize-hotfix.outputs.release || needs.authorize.outputs.release) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ steps.stage.outputs.candidate_id }}
      baseline: ${{ steps.stage.outputs.baseline }}
      sha: ${{ steps.stage.outputs.sha }}
      mode: ${{ needs.authorize.outputs.mode }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize-hotfix.outputs.sha || needs.authorize.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: stage
        name: Stage exact SHA with production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_SHA: ${{ needs.authorize-hotfix.outputs.sha || needs.authorize.outputs.sha }}
          RELEASE_MODE: ${{ needs.authorize.outputs.mode }}
          RELEASE_AUTHORIZATION: ${{ needs.authorize-hotfix.outputs.release_authorization || needs.authorize.outputs.release_authorization }}
          CONTROLLER_SHA: ${{ needs.authorize.outputs.controller_sha }}
          EXPECTED_BASELINE_DEPLOYMENT: ${{ needs.authorize-hotfix.outputs.baseline_deployment || needs.authorize.outputs.baseline_deployment }}
          EXPECTED_BASELINE_UPDATED_AT: ${{ needs.authorize-hotfix.outputs.baseline_updated_at || needs.authorize.outputs.baseline_updated_at }}
          EXPECTED_BASELINE_SHA: ${{ needs.authorize-hotfix.outputs.baseline_sha || needs.authorize.outputs.baseline_sha }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: node "$RUNNER_TEMP/release-controls.js" stage
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 1

  source-qa:
    name: Record source QA
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-state
          path: ${{ runner.temp }}
      - name: Bind passing source evidence to this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: node "$RUNNER_TEMP/release-controls.js" record-source-qa
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-source-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 1

  recovery-evidence:
    name: Run release compatibility suite
    needs: [candidate, source-qa]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.source-qa.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}/trusted
      - uses: actions/download-artifact@v8
        with:
          name: production-release-source-state
          path: ${{ runner.temp }}/source
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: compatibility-plan
        name: Plan exact-baseline compatibility proof
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/source/release-state.json
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/trusted/release-controls.js" plan-recovery-compatibility
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        if: steps.compatibility-plan.outputs.required == 'true'
        with:
          install: false
          node-version-file: false
      - name: Install dependencies for exact-baseline compatibility proof
        if: steps.compatibility-plan.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - id: compatibility
        name: Run and validate exact-baseline compatibility suite
        if: steps.compatibility-plan.outputs.required == 'true'
        env:
          RELEASE_COMPATIBILITY_REPORT: ${{ runner.temp }}/release-compatibility-report.json
        run: pnpm test:integration --runTestsByPath test/integration/persistence/release-compatibility.itest.ts --json --outputFile="$RELEASE_COMPATIBILITY_REPORT"
      - uses: actions/upload-artifact@v7
        if: steps.compatibility-plan.outputs.required == 'true'
        with:
          name: release-compatibility-report
          path: ${{ runner.temp }}/release-compatibility-report.json
          if-no-files-found: error
          retention-days: 1

  recovery-receipt:
    name: Record release recovery receipt
    needs: [candidate, source-qa, recovery-evidence]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.source-qa.result == 'success' &&
      needs.recovery-evidence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}/trusted
      - uses: actions/download-artifact@v8
        with:
          name: production-release-source-state
          path: ${{ runner.temp }}/source
      # Git history for the plan only: the sparse checkout leaves no candidate code to run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: compatibility-plan
        name: Recompute exact-baseline compatibility plan
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/source/release-state.json
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/trusted/release-controls.js" plan-recovery-compatibility
      - uses: actions/download-artifact@v8
        if: steps.compatibility-plan.outputs.required == 'true'
        with:
          name: release-compatibility-report
          path: ${{ runner.temp }}/compatibility-report
      - name: Check compatibility report shape
        if: steps.compatibility-plan.outputs.required == 'true'
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/source/release-state.json
          RELEASE_COMPATIBILITY_REPORT: ${{ runner.temp }}/compatibility-report/release-compatibility-report.json
        run: node "$RUNNER_TEMP/trusted/release-controls.js" verify-compatibility-report
      - name: Create run-bound machine-verified recovery receipt
        env:
          RELEASE_STATE_FILE: ${{ runner.temp }}/source/release-state.json
          RELEASE_ACCEPTED_STATE_FILE: ${{ runner.temp }}/release-state.json
          GH_TOKEN: ${{ github.token }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node "$RUNNER_TEMP/trusted/release-controls.js" record-recovery-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 31

  promote-and-smoke:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, recovery-receipt]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.recovery-receipt.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      production_deployment_id: ${{ steps.promote.outputs.production_deployment_id }}
      production_sha: ${{ steps.promote.outputs.production_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: promote
        name: Recheck baseline and promote candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: node "$RUNNER_TEMP/release-controls.js" promote
      - name: Summarize production acceptance
        env:
          CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
          BASELINE: ${{ needs.candidate.outputs.baseline }}
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: |
          {
            echo '### Production promoted'
            echo "- Promoted candidate: \`$CANDIDATE_ID\`"
            echo "- Authorized source SHA: \`$RELEASE_SHA\`"
            echo "- Previous production baseline: \`$BASELINE\`"
            echo "- Live alias: https://$PRODUCTION_ALIAS"
            echo 'Production smoke now runs; the post-promotion acceptance rule in WORKFLOW.md decides whether a manual review gate follows.'
          } >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    name: Production smoke
    needs: [candidate, promote-and-smoke]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.promote-and-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production-smoke
    outputs:
      smoke_results: ${{ steps.summary.outputs.smoke_results }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Mask session cookie values
        env:
          SMOKE_STORAGE_STATE: ${{ secrets.SMOKE_STORAGE_STATE }}
        run: |
          jq -r '.cookies[].value' <<<"$SMOKE_STORAGE_STATE" | while IFS= read -r value; do
            [ -n "$value" ] && echo "::add-mask::$value"
          done
          exit 0
      - id: smoke
        name: Run production smoke
        continue-on-error: true
        env:
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID }}
          SMOKE_STORAGE_STATE: ${{ secrets.SMOKE_STORAGE_STATE }}
          SMOKE_USER_EMAIL: ${{ vars.SMOKE_USER_EMAIL }}
          SMOKE_TEAM_ID: ${{ vars.SMOKE_TEAM_ID }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/smoke-report.json
        run: pnpm test:smoke
      - id: summary
        name: Summarize smoke results
        if: always()
        env:
          SMOKE_REPORT_FILE: ${{ runner.temp }}/smoke-report.json
        run: node scripts/release-controls.js summarize-smoke

  classify-production-smoke:
    name: Classify production smoke
    needs: [candidate, promote-and-smoke, production-smoke]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.promote-and-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      outcome: ${{ steps.classify.outputs.outcome }}
      auth: ${{ steps.classify.outputs.auth }}
      after_deployment_id: ${{ steps.classify.outputs.after_deployment_id }}
      after_sha: ${{ steps.classify.outputs.after_sha }}
      auto_accept: ${{ steps.classify.outputs.auto_accept }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: classify
        name: Classify smoke result against the promoted deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          # A smoke job that never reported yields an empty report, which waits at the manual gate.
          SMOKE_RESULTS: ${{ needs.production-smoke.outputs.smoke_results || '[]' }}
          SMOKE_BEFORE_DEPLOYMENT_ID: ${{ needs.promote-and-smoke.outputs.production_deployment_id }}
          SMOKE_BEFORE_SHA: ${{ needs.promote-and-smoke.outputs.production_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" classify-smoke
      - name: Explain the manual gate
        if: steps.classify.outputs.outcome == 'infrastructure'
        run: |
          echo '::warning::Production smoke could not judge the release: either the smoke session was invalid or the smoke job produced no report. The release is not rolled back; the manual review gate follows. Check the Production smoke job log first; re-login only if the session check failed (docs/release-runbook.md, Smoke session).'
          echo 'Infrastructure failure: check the Production smoke job log. If the session check failed, re-login and refresh the session secret (docs/release-runbook.md, Smoke session); if no report was produced, fix the runner or install step.' >> "$GITHUB_STEP_SUMMARY"

  accept-production-smoke:
    name: Accept production smoke
    needs:
      [
        candidate,
        promote-and-smoke,
        production-smoke,
        classify-production-smoke,
      ]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.classify-production-smoke.result == 'success' &&
      needs.classify-production-smoke.outputs.outcome == 'pass' &&
      needs.classify-production-smoke.outputs.auto_accept == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      # Only .nvmrc from trusted main: the receipt step needs no candidate code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Record smoke acceptance receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          RELEASE_FINAL_STATE_FILE: ${{ runner.temp }}/release-final-state.json
          SMOKE_BEFORE_DEPLOYMENT_ID: ${{ needs.promote-and-smoke.outputs.production_deployment_id }}
          SMOKE_BEFORE_SHA: ${{ needs.promote-and-smoke.outputs.production_sha }}
          SMOKE_AFTER_DEPLOYMENT_ID: ${{ needs.classify-production-smoke.outputs.after_deployment_id }}
          SMOKE_AFTER_SHA: ${{ needs.classify-production-smoke.outputs.after_sha }}
          SMOKE_OUTCOME: ${{ needs.classify-production-smoke.outputs.outcome }}
          SMOKE_AUTH: ${{ needs.classify-production-smoke.outputs.auth }}
          SMOKE_AUTO_ACCEPT: ${{ needs.classify-production-smoke.outputs.auto_accept }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" record-smoke-acceptance
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-final-state
          path: ${{ runner.temp }}/release-final-state.json
          if-no-files-found: error
          retention-days: 31

  production-acceptance:
    name: Accept production QA
    needs: [candidate, classify-production-smoke]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      (needs.classify-production-smoke.result == 'failure' ||
      (needs.classify-production-smoke.result == 'success' &&
      (needs.classify-production-smoke.outputs.outcome == 'infrastructure' ||
      (needs.classify-production-smoke.outputs.outcome == 'pass' &&
      needs.classify-production-smoke.outputs.auto_accept != 'true'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment:
      name: production-release-review
      url: https://${{ vars.PRODUCTION_ALIAS }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Record exact production QA approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          RELEASE_FINAL_STATE_FILE: ${{ runner.temp }}/release-final-state.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node "$RUNNER_TEMP/release-controls.js" record-production-qa
      - uses: actions/upload-artifact@v7
        with:
          name: production-release-final-state
          path: ${{ runner.temp }}/release-final-state.json
          if-no-files-found: error
          retention-days: 31

  recover-after-production-qa-failure:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, classify-production-smoke, production-acceptance]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      ((needs.classify-production-smoke.result == 'success' &&
      needs.classify-production-smoke.outputs.outcome == 'regression') ||
      needs.production-acceptance.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Roll back only with explicit compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/release-controls.js" rollback-if-compatible

  finalize-release:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    needs: [candidate, production-acceptance, accept-production-smoke]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      ((needs.production-acceptance.result == 'success' &&
      needs.accept-production-smoke.result == 'skipped') ||
      (needs.accept-production-smoke.result == 'success' &&
      needs.production-acceptance.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: production-release-final-state
          path: ${{ runner.temp }}
      - name: Tag exact SHA and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-final-state.json
        run: node "$RUNNER_TEMP/release-controls.js" finalize

  recover:
    concurrency:
      group: production-release
      cancel-in-progress: false
      queue: max
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Verify original accepted artifact then recover its baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RELEASE_RUN_ID: ${{ inputs.original_run }}
          RELEASE_RECOVERY_STATE_FILE: ${{ runner.temp }}/release-recovery-state.json
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-recovery-state.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: |
          node scripts/release-controls.js recover-verify
          node scripts/release-controls.js rollback-if-compatible
          echo 'Owner recovery verified public health; no data rollback, tag or release publication.' >> "$GITHUB_STEP_SUMMARY"

  merge-back:
    needs: [candidate, finalize-release]
    if: >-
      always() && !cancelled() && needs.candidate.result == 'success' &&
      needs.finalize-release.result == 'success' &&
      needs.candidate.outputs.mode == 'hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-controller
          path: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: production-release-accepted-state
          path: ${{ runner.temp }}
      - name: Prepare ordinary hotfix merge-back pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          RELEASE_STATE_FILE: ${{ runner.temp }}/release-state.json
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node "$RUNNER_TEMP/release-controls.js" merge-back

  failure-summary:
    needs:
      - authorize
      - authorize-hotfix
      - candidate
      - recovery-evidence
      - recovery-receipt
      - promote-and-smoke
      - production-smoke
      - classify-production-smoke
      - accept-production-smoke
      - production-acceptance
      - recover-after-production-qa-failure
      - finalize-release
      - merge-back
      - recover
      - source-qa
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record release failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### Production release stopped'
            echo
            echo "A guarded release or merge-back job failed. Inspect the actual production deployment, tag and immutable artifacts before retrying; publication may have succeeded before synchronization failed: $RUN_URL"
            echo 'For synchronization failure, start an agent with this run and the accepted release-state artifact. Follow WORKFLOW.md hotfix synchronization; preserve both histories and pending changesets. Do not rerun publication or bypass checks to resolve merge-back.'
            echo 'For a promoted run left pending/cancelled, the owner may dispatch recover with its original run ID while accepted evidence remains available. Expired evidence or changed alias stops; no timeout recovery is implied.'
          } >> "$GITHUB_STEP_SUMMARY"
