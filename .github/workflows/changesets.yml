name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false # half a written release PR is worse than a slow one

env:
  HUSKY: 0

jobs:
  release:
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # RELEASE_TOKEN (a PAT/App token, not the default GITHUB_TOKEN) so the
      # version PR is authored by a real identity — that is what lets its
      # `Verify` checks trigger and pass, which the default
      # GITHUB_TOKEN cannot do (GitHub suppresses workflows on bot-authored PRs).
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          install: false
          node-version-file: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Version phase only: when changesets are pending, open/refresh the
      # "release: update versions" PR (bump + CHANGELOG + changeset deletions).
      # A human reviews and merges it — the changesets-recommended gate.
      - uses: changesets/action@v2
        id: changesets
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm run release:version
          commit-message: |
            chore(release): update versions

            Automated version bump: package.json version, CHANGELOG.md entries, and
            consumed changeset deletions, from the pending changesets in .changeset/.
          pr-title: "release: update versions"
          create-github-releases: false
          push-git-tags: false

      # The action's default parser does not recognize our linked, dated
      # changelog headings and can exceed its PR-body limit with full history.
      # Replace the body with only the current version's accumulated notes.
      - name: Update version PR body with current release notes
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          node scripts/release-pr-body.js > "$RUNNER_TEMP/release-pr-body.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/release-pr-body.md"
