name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (engines is >=22)
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm run release:version
          # changeset tag creates vX.Y.Z for the current version; the action
          # pushes the tag and creates the GitHub Release from CHANGELOG.md.
          # Runs only when no changesets are pending (i.e. after the version
          # PR merges) and skips tags that already exist, so it is idempotent.
          publish: pnpm run release:publish
          commit: "release: update versions"
          # [skip review] keeps the auto-opened release PR out of claude-code-review
          title: "release: update versions [skip review]"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release back to dev
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Server-side merge of main into dev -- no PR, no local git state.
          # 409 on conflict, 4xx if a ruleset blocks the push; both degrade
          # to a warning for manual handling.
          gh api "repos/${{ github.repository }}/merges" \
            -f base=dev -f head=main \
            -f commit_message="chore: sync v${version} release back to dev [skip review]" \
            || echo "::warning::Could not merge main into dev (conflict or ruleset restriction); sync manually."
