name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm test:workflow
      - run: pnpm check:workflow
      - run: pnpm typecheck:strict
      - run: pnpm lint

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Proves idempotency, ordering and casting against a real in-memory
      # MongoDB. `pnpm test` covers only the backend and frontend projects,
      # so until now nothing on the merge path ran these.
      - run: pnpm test:integration

  blueprint:
    name: Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter blueprint test
      - run: pnpm --filter blueprint build

  # The branch rulesets require a check named exactly "Verify". Renaming the
  # jobs without this would leave that context permanently unreported and
  # every pull request blocked, so the name stays and becomes the gate the
  # parallel jobs report through.
  verify:
    name: Verify
    needs: [test, static, integration, blueprint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the parallel jobs' result
        run: |
          echo "test=${{ needs.test.result }}"
          echo "static=${{ needs.static.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "blueprint=${{ needs.blueprint.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
