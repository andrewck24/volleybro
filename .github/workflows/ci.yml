name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      source:
        description: Optional exact application SHA for owner-dispatched CI evidence
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  source-identity:
    name: Source identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      inputs.source == '' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       github.actor == vars.RELEASE_OWNER_LOGIN && github.triggering_actor == vars.RELEASE_OWNER_LOGIN)
    cache-mode: none
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: Validate requested source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ] && ! [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source must be an exact commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: source-identity
    cache-mode: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Producer workflow ${{ github.workflow_sha }}
        run: ":"
      - name: Source tree ${{ needs.source-identity.outputs.tree }} at ${{ needs.source-identity.outputs.sha }}
        env:
          TESTED_SHA: ${{ needs.source-identity.outputs.sha }}
          TESTED_TREE: ${{ needs.source-identity.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TESTED_TREE"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.source == ''
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is GitHub's merge commit; the release path check diffs it against its first parent, the base. Full history lets the decision-record check find the merge-base and read every commit trailer.
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: node scripts/design-document.js --check
      - run: pnpm check:workflow
      - name: Classify changed paths for the release
        if: github.event_name == 'pull_request'
        run: BASE_SHA=$(git rev-parse HEAD^1) node scripts/release-controls.js check-path-classification
      - run: pnpm typecheck:strict
      - run: pnpm lint

  workflow-tests:
    name: Workflow tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.source == ''
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Split by file name, not a list, so a new test file always runs in one shard.
      - run: |
          if [ "${{ matrix.shard }}" = 1 ]; then
            node --test scripts/__tests__/release-controls-*.test.js
          else
            node --test $(ls scripts/__tests__/*.test.js | grep -v /release-controls-)
          fi

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: source-identity
    cache-mode: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Producer workflow ${{ github.workflow_sha }}
        run: ":"
      - name: Source tree ${{ needs.source-identity.outputs.tree }} at ${{ needs.source-identity.outputs.sha }}
        env:
          TESTED_SHA: ${{ needs.source-identity.outputs.sha }}
          TESTED_TREE: ${{ needs.source-identity.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TESTED_TREE"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - id: mongodb-memory-server-version
        run: echo "version=$(pnpm pkg get devDependencies.mongodb-memory-server --workspace-root | tr -d '\"^')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ steps.mongodb-memory-server-version.outputs.version }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration

  blueprint:
    name: Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.source == ''
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter blueprint test
      - run: pnpm --filter blueprint test:persistence
      - run: pnpm --filter blueprint build

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Lint commits not already on the integration default
        run: |
          BASE=$(git merge-base "$PR_HEAD" "origin/$DEFAULT_BRANCH")
          if [ "$BASE" != "$PR_HEAD" ]; then
            pnpm exec commitlint --from "$BASE" --to "$PR_HEAD"
          fi
        env:
          COMMITLINT_BRANCH: ${{ github.head_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Validate PR title
        run: |
          if [ "$PR_TITLE" = "release: update versions" ]; then
            node scripts/release-controls.js validate-version-pr
          else
            printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --config commitlint.title.config.js
          fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

  # The app-build lane of scripts/verify.js (pnpm build, then
  # scripts/assert-sw.js) has no job here: it runs as Vercel's build command,
  # whose check a pull request must also pass.

  # The branch rulesets require a check named exactly "Verify". Renaming the
  # jobs without this would leave that context permanently unreported and
  # every pull request blocked, so the name stays and becomes the gate the
  # parallel jobs report through.
  verify:
    name: Verify
    needs:
      [
        source-identity,
        test,
        static,
        workflow-tests,
        integration,
        blueprint,
        commitlint,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the parallel jobs' result
        run: |
          echo "test=${{ needs.test.result }}"
          echo "static=${{ needs.static.result }}"
          echo "workflow-tests=${{ needs.workflow-tests.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "blueprint=${{ needs.blueprint.result }}"
          echo "commitlint=${{ needs.commitlint.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.test.result != 'success' || needs.integration.result != 'success' || (inputs.source == '' && needs.workflow-tests.result != 'success') || (github.event_name == 'pull_request' && needs.commitlint.result != 'success') }}" = "true" ]; then
            exit 1
          fi
