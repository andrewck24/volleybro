name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm test:workflow
      - run: pnpm check:workflow
      - run: pnpm typecheck:strict
      - run: pnpm lint

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - id: mongodb-memory-server-version
        run: echo "version=$(pnpm pkg get devDependencies.mongodb-memory-server --workspace-root | tr -d '\"^')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ steps.mongodb-memory-server-version.outputs.version }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration

  blueprint:
    name: Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter blueprint test
      - run: pnpm --filter blueprint build

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Lint commits not already on the integration default
        run: |
          BASE=$(git merge-base "$PR_HEAD" "origin/$DEFAULT_BRANCH")
          if [ "$BASE" != "$PR_HEAD" ]; then
            pnpm exec commitlint --from "$BASE" --to "$PR_HEAD"
          fi
        env:
          COMMITLINT_BRANCH: ${{ github.head_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Validate PR title
        run: |
          if [ "$PR_TITLE" = "release: update versions" ]; then
            node scripts/release-controls.js validate-version-pr
          else
            printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --config commitlint.title.config.js
          fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}

  # The branch rulesets require a check named exactly "Verify". Renaming the
  # jobs without this would leave that context permanently unreported and
  # every pull request blocked, so the name stays and becomes the gate the
  # parallel jobs report through.
  verify:
    name: Verify
    needs: [test, static, integration, blueprint, commitlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the parallel jobs' result
        run: |
          echo "test=${{ needs.test.result }}"
          echo "static=${{ needs.static.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "blueprint=${{ needs.blueprint.result }}"
          echo "commitlint=${{ needs.commitlint.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (github.event_name == 'pull_request' && needs.commitlint.result != 'success') }}" = "true" ]; then
            exit 1
          fi
