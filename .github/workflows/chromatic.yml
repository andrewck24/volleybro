name: "Chromatic Publish"

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic diffs against history to find a baseline
          persist-credentials: false
          # pull_request checks out an ephemeral merge commit; TurboSnap would
          # then diff every integration commit since the branch point.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Assess Storybook impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/chromatic-scope.js --force
          else
            node scripts/chromatic-scope.js --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      # No secrets: this step runs the PR's own Storybook config.
      - name: Build Storybook for dependency scope
        id: storybook
        if: steps.scope.outputs.needs_stats == 'true'
        run: pnpm build-storybook --stats-json --output-dir storybook-static

      - name: Assess Storybook impact with build stats
        id: stats_scope
        if: steps.storybook.outcome == 'success'
        run: |
          node scripts/chromatic-scope.js --base "$BASE_SHA" --head "$HEAD_SHA" \
            --stats storybook-static/preview-stats.json

      - uses: chromaui/action@6ac4c49524e1b1358b8c593c5eea877604228268 # v18.14.2
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skip: ${{ (steps.stats_scope.outputs.skip || steps.scope.outputs.skip) == 'true' }}
          storybookBuildDir: ${{ steps.storybook.outcome == 'success' && 'storybook-static' || '' }}
          onlyChanged: true
