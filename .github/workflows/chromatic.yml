name: "Chromatic Publish"

permissions:
  contents: read

# Paths that can change what a story renders. `src/components/game/**` is
# here because five story files import from it -- without it, editing a
# component only its story covers produces no visual check at all.
# `src/components/layout/**` has no story importing it today and is kept so
# coverage is already in place when one appears.
on:
  push:
    paths:
      - "package.json"
      - ".storybook/**"
      - "src/components/ui/**"
      - "src/components/custom/**"
      - "src/components/game/**"
      - "src/components/layout/**"
      - "src/stories/**"
  workflow_dispatch:

# Snapshots are billed, so a superseded push should not keep capturing them.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !contains(github.event.head_commit.message, '[skip chromatic]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic reads git history to find each build's baseline.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
