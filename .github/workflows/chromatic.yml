name: "Chromatic Publish"

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic diffs against history to find a baseline
          persist-credentials: false
          # pull_request checks out an ephemeral merge commit; TurboSnap would
          # then diff every integration commit since the branch point.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Assess Storybook impact
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/chromatic-scope.js --force
          else
            node scripts/chromatic-scope.js --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skip: ${{ steps.scope.outputs.skip == 'true' }}
          onlyChanged: true
