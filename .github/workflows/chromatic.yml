name: "Chromatic Publish"

permissions:
  contents: read

on:
  push:
    paths:
      - "pnpm-lock.yaml"
      - ".storybook/**"
      - "src/components/ui/**"
      - "src/components/custom/**"
      - "src/components/game/**"
      - "src/components/layout/**"
      - "src/stories/**"
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !contains(github.event.head_commit.message, '[skip chromatic]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic diffs against history to find a baseline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Without this every trigger snapshots all 105 stories, and the paths
          # filter above cannot tell a payload edit inside src/components/game/
          # from a visual one.
          onlyChanged: true
          # Served from staticDirs, so no story imports them and the dependency
          # graph cannot see them; changing one falls back to a full snapshot.
          externals: |
            public/**
