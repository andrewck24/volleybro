name: 🐛 Bug Report
description: 回報一個錯誤、非預期行為或測試失敗
title: "[Bug] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感謝你回報問題！請填寫以下資訊幫助我們快速定位和解決問題。

  - type: textarea
    id: description
    attributes:
      label: 🔍 問題描述
      description: 清楚地描述發生了什麼問題
      placeholder: 描述你遇到的錯誤或非預期行為...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 重現步驟
      description: 詳細的重現步驟，包括測試案例（如適用）
      placeholder: |
        1. 前往 '...'
        2. 點擊 '....'
        3. 執行 '....'
        4. 看到錯誤
      value: |
        1. 
        2. 
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 預期行為
      description: 描述你預期應該發生什麼
      placeholder: 清楚簡潔地描述預期的正確行為...

  - type: textarea
    id: actual
    attributes:
      label: ❌ 實際行為
      description: 描述實際發生了什麼
      placeholder: 實際看到的行為...

  - type: textarea
    id: logs
    attributes:
      label: 📝 錯誤訊息與日誌
      description: 相關的錯誤訊息、堆疊追蹤、測試輸出或截圖
      render: shell
      placeholder: |
        // 錯誤訊息
        // 控制台輸出
        // 測試失敗日誌

  - type: input
    id: os
    attributes:
      label: 💻 作業系統
      placeholder: "例如: macOS 14.0, Ubuntu 22.04, Windows 11"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 📦 版本資訊
      description: Node.js、瀏覽器、框架版本等
      placeholder: "例如: Node 18.17.0, Chrome 120, React 18.2.0"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 嚴重程度
      description: 這個問題對你的影響程度
      options:
        - 低 (P4) - 小問題或改善建議
        - 中 (P3) - 影響功能但有解決方案
        - 高 (P2) - 阻礙重要功能
        - 緊急 (P1) - 系統無法使用或資料丟失
    validations:
      required: true

  - type: dropdown
    id: bug_type
    attributes:
      label: 🏷️ 錯誤類型
      options:
        - 功能錯誤
        - 界面問題
        - 效能問題
        - 相容性問題
        - 安全問題
        - 測試失敗
        - 回歸錯誤
        - 文件錯誤

  - type: input
    id: story_points_bug
    attributes:
      label: 📊 預估修復複雜度 (Story Points)
      description: 如果你有經驗，可以估算修復的複雜度 (1,2,3,5,8,13...)
      placeholder: "例如: 3"

  - type: dropdown
    id: fix_effort
    attributes:
      label: ⏱️ 預估修復工時
      description: 修復這個問題可能需要多少時間？
      options:
        - 極小 (< 1h) - 快速修復
        - 小 (1-4h) - 半天內
        - 中 (4-16h) - 1-2天
        - 大 (2-5d) - 一週內
        - 極大 (> 5d) - 需要詳細調查

  - type: textarea
    id: impact_analysis
    attributes:
      label: 📊 影響分析
      description: 這個錯誤影響了哪些使用者或功能？
      placeholder: |
        - 影響的使用者群體
        - 影響的功能模組
        - 商業影響程度

  - type: textarea
    id: additional
    attributes:
      label: 📄 補充資訊
      description: 任何其他相關資訊、暫時解決方案或相關 issue
