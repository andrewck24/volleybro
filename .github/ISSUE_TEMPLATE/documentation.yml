name: 📖 Documentation Issue
description: 文件錯誤、缺失或改善建議
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc_type
    attributes:
      label: 📂 文件類型
      options:
        - README
        - API 文件
        - 教學指南
        - 範例程式碼
        - 設定說明
        - 貢獻指南
        - 其他
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 📍 文件位置
      description: 檔案路徑、網址或章節名稱
      placeholder: "例如: docs/api/getting-started.md 或 https://example.com/docs"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: ❓ 問題描述
      description: 具體描述文件的問題
      placeholder: |
        文件有以下問題：
        - 資訊過時
        - 說明不清楚  
        - 範例錯誤
        - 缺少重要資訊
    validations:
      required: true

  - type: textarea
    id: suggested_fix
    attributes:
      label: ✏️ 建議修正
      description: 你建議如何改善這個文件？
      placeholder: 建議的修正內容或改善方向...

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 貢獻意願
      options:
        - label: 我願意協助修正這個文件問題
          required: false
