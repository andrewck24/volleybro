packages:
  - "."
  - blueprint

# The two @hookform/resolvers entries: only the Zod resolver is used. The package still lists ajv and
# ajv-formats as peers (optional since 5.x), which these entries strip. Revisit before enabling the AJV resolver.
# The zod and undici entries lift exact upstream pins to a patched version.
overrides:
  "@hookform/resolvers@6.0.0>ajv": "-"
  "@hookform/resolvers@6.0.0>ajv-formats": "-"
  # emdash and @emdash-cms/auth pin zod 4.5.4 exactly and @serwist/build pins 4.6.5; remove once upstream ships a fixed pin.
  zod@>=4.0.0 <4.6.6: ^4.6.7
  # miniflare pins undici 7.29.1 exactly, even via the latest wrangler; remove once upstream ships a fixed pin.
  undici@>=7.0.0 <7.30.1: ^7.30.1

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js-pure: true
  esbuild: true
  mongodb-memory-server: false
  sharp: true
  unrs-resolver: true
  workerd: true
