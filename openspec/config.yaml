schema: spec-driven

context: |
  Domain: Volleyball team management and match recording web application
  Language: TypeScript 5.x (strict mode migration in progress, decorators enabled)
  Runtime: Node.js 20+
  Package manager: npm

  Frontend:
  - Next.js 16+ (App Router, RSC), React 19
  - Shadcn/UI + Tailwind CSS + CVA variants + cn() utility
  - Redux Toolkit (complex app state) + SWR (server state, dedup intervals)
  - React Hook Form + Zod (runtime validation)
  - PWA via Serwist (configurator mode)

  Backend:
  - Next.js API Routes (App Router)
  - MongoDB Atlas + Mongoose ODM (embedded document model)
  - Better Auth with Google OAuth
  - InversifyJS dependency injection (@injectable/@inject decorators)

  Architecture: Clean Architecture + Domain-Driven Design
  - Domain Layer (src/entities/) - pure business logic, no external deps
  - Application Layer (src/applications/) - use cases, repository/service interfaces
  - Infrastructure Layer (src/infrastructure/) - MongoDB repos, auth services, DI container
  - Interface Layer (src/interface/controllers/) - API controllers orchestrating use cases
  - Presentation Layer (src/app/ + src/components/) - Next.js pages + React components

  Dependency direction: entities ← applications ← infrastructure (never reverse)

  Testing:
  - Jest + React Testing Library, unified jsdom environment
  - MongoDB/Mongoose mocked in jest.setup.ts
  - data-testid attributes (kebab-case, semantic) on testable components

  Git workflow:
  - Branches: main (production), dev (development), feature/###-name or fix/###-name
  - Feature/fix branches merge to dev by default (--base dev)
  - Angular commit convention (feat/fix/docs/refactor/test/chore with scope), English only
  - PR title in English, body in English with zh-TW summary appended
  - No AI attribution in commits or PRs (no Co-Authored-By: Claude, no "generated by Claude")

  Conventions:
  - File naming: kebab-case for components, dot notation for use cases (.usecase.ts), .mongo.ts for repo implementations
  - Variables/functions: camelCase; booleans: is/has/can prefix; event handlers: handle prefix; constants: UPPER_SNAKE_CASE
  - ESLint (Airbnb + next/core-web-vitals) + Prettier (with tailwindcss plugin)
  - Path aliases: @/* for absolute imports from src/
  - API pattern: auth check → authorization → Zod validation → controller → use case → response
  - Components organized by domain: ui/, custom/, auth/, team/, record/, match/, landing/

rules:
  specs:
    - Be explicit about mechanisms, not just outcomes (say HOW, not just WHAT)
    - Specify which Clean Architecture layer each requirement belongs to
    - Define Zod schemas for any new data structures or API inputs
    - Specify authorization requirements (which roles can perform the action)
    - Include error scenarios and expected HTTP status codes for API endpoints
  tasks:
    - Each task should specify which architecture layer(s) it touches
    - Include TDD step (write tests first) as part of implementation tasks
    - Add "run npm test, npm run lint, npm run build" as a verification task
    - Break tasks into chunks that respect layer boundaries
  design:
    - Follow existing repository pattern (abstract interface in applications/, MongoDB implementation in infrastructure/)
    - Use InversifyJS DI for all new use cases and repositories
    - Prefer Mongoose embedded documents over references for performance
    - Use SWR for server state, Redux Toolkit only for complex client-side state
    - New UI components should use Shadcn/UI patterns with CVA variants
    - Document authorization flow for any new endpoints